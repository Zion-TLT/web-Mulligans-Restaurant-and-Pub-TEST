---
title: Page Not Found | {{ site.name }}
description: The page you were looking for could not be found.
---
<section class="mx-auto max-w-6xl px-4 py-16">
  <h1 class="text-4xl font-bold">Page not found</h1>
  <p class="mt-4">The page you were looking for doesn't exist or has moved.</p>
  <p class="mt-8 flex flex-wrap gap-4">
    <a href="/" class="btn">Go to the homepage</a>
    <a href="{{ site.telHref }}" class="tap underline">Call {{ site.phone }}</a>
  </p>
</section>
